name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Tests
        run: swift test
      - name: Universal release build and gate
        run: make build check
      - name: Homebrew formula check
        run: scripts/check-formula.sh

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License check
        run: scripts/check-license.sh
      - name: Workflow check
        run: scripts/check-workflows.sh
      - name: README check
        run: scripts/check-readme.sh

  plugin-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Plugin manifests, hook, and status line
        run: scripts/check-plugin.sh
      - name: MCP package
        run: scripts/check-mcp.sh
