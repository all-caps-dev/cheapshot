name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', '**.md']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Tests
        run: swift test
      - name: Universal release build and gate
        run: make build check
