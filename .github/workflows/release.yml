name: Release

# A v* tag builds the universal binary, publishes it as a GitHub Release, and
# bumps the Homebrew tap. Signing and notarization run only when the six Apple
# secrets are set; without them the zip carries the linker's ad-hoc signature,
# which Homebrew installs fine (its downloads are never quarantined) and a raw
# download does not. The tap bump runs only when COMMITTER_TOKEN is set.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Job-level `if` cannot read the secrets context, so one small job turns the
  # presence of each secret group into an output the other jobs can branch on.
  secrets:
    runs-on: ubuntu-latest
    outputs:
      sign: ${{ steps.probe.outputs.sign }}
      tap: ${{ steps.probe.outputs.tap }}
    steps:
      - id: probe
        env:
          HAVE_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' && secrets.ASC_KEY_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER != '' }}
          HAVE_TAP: ${{ secrets.COMMITTER_TOKEN != '' }}
        run: |
          echo "sign=$HAVE_SIGNING" >> "$GITHUB_OUTPUT"
          echo "tap=$HAVE_TAP" >> "$GITHUB_OUTPUT"
          echo "signing: $HAVE_SIGNING, tap bump: $HAVE_TAP"

  release:
    needs: secrets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary and gate it
        run: make build check

      - name: Import the Developer ID certificate
        if: needs.secrets.outputs.sign == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/app.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychain -d user -s "$KC"

      - name: Sign, zip, notarize
        if: needs.secrets.outputs.sign == 'true'
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
          TAG: ${{ github.ref_name }}
        run: |
          trap 'rm -f AuthKey.p8 notary.json' EXIT
          codesign --force --timestamp --options runtime --sign "Developer ID Application" cheapshot
          codesign --verify --verbose=2 cheapshot
          ditto -c -k --norsrc cheapshot "cheapshot-${TAG}-macos.zip"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o AuthKey.p8
          xcrun notarytool submit "cheapshot-${TAG}-macos.zip" \
            --key AuthKey.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER" \
            --wait --timeout 30m --output-format json > notary.json || true
          cat notary.json
          grep -qE '"status"[[:space:]]*:[[:space:]]*"Accepted"' notary.json || { echo "notarization not Accepted"; exit 1; }
          printf 'Signed with Developer ID and notarized by Apple.\n' > release-note.md

      - name: Zip the ad-hoc signed binary
        if: needs.secrets.outputs.sign != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The linker already ad-hoc signed the binary; make sure that signature is intact.
          codesign --verify --verbose=2 cheapshot
          ditto -c -k --norsrc cheapshot "cheapshot-${TAG}-macos.zip"
          cat > release-note.md <<'NOTE'
          **Install with Homebrew:** `brew install all-caps-dev/tap/cheapshot`

          This build is ad-hoc signed, not notarized (no Developer ID in this repository yet).
          Homebrew installs it without a Gatekeeper prompt. A direct download of the zip will be
          blocked on first launch; use the brew line, or `xattr -d com.apple.quarantine cheapshot`
          after unzipping if you know what you are doing.
          NOTE

      - name: Checksum
        env:
          TAG: ${{ github.ref_name }}
        run: shasum -a 256 "cheapshot-${TAG}-macos.zip" | tee "cheapshot-${TAG}-macos.zip.sha256"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cheapshot-${{ github.ref_name }}-macos.zip
            cheapshot-${{ github.ref_name }}-macos.zip.sha256
          body_path: release-note.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  tap:
    needs: [secrets, release]
    if: needs.secrets.outputs.tap == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Bump the Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: cheapshot
          formula-path: Formula/cheapshot.rb
          homebrew-tap: all-caps-dev/homebrew-tap
          base-branch: main
          create-pullrequest: false
          download-url: https://github.com/all-caps-dev/cheapshot/releases/download/${{ github.ref_name }}/cheapshot-${{ github.ref_name }}-macos.zip
          commit-message: |
            {{formulaName}} {{version}}

            Created by https://github.com/all-caps-dev/cheapshot/actions/runs/${{ github.run_id }}
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
